services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: >
      -m /models/MiniCPM-V-2_6-Q6_K.gguf
      --mmproj /models/mmproj-model-f16.gguf
      --port 8080
      --host 0.0.0.0
      -n 2048
      -fa on
    volumes:
      - ./models:/models
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
